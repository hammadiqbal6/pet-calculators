name: CI

# Fast PR safety net. Full audits / Lighthouse / proof: workflow_dispatch in full-checks.yml.
# Owner runs `npm run audit`, `npm run lhci`, and `npm run proof` locally before opening PRs.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-audit:
    name: Build, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://pet-calculators.hammadiqbal117.workers.dev
          PUBLIC_SITE_URL_PAYMENT_FEES: https://payment-fee-calculators.hammadiqbal117.workers.dev
          PUBLIC_SITE_URL_BUSINESS_DOCS: https://business-document-generators.hammadiqbal117.workers.dev
          PUBLIC_SITE_URL_HOME_GARDEN: https://home-garden-calculators.hammadiqbal117.workers.dev
          PUBLIC_SITE_URL_FIBER_ARTS: https://fiber-arts-calculators.hammadiqbal117.workers.dev
          PUBLIC_SITE_URL_PET: https://pet-calculators.hammadiqbal117.workers.dev

      - name: Unit tests (formulas)
        run: npm test
